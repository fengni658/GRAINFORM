<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>局部落砂 · 独立规则原型</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c141b;color:#deecef;font:14px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:24px auto;padding:0 22px}h1{font-size:24px;margin:0 0 8px}.note{color:#aac1cc;max-width:950px}.layout{display:grid;grid-template-columns:minmax(300px,576px) minmax(240px,1fr);gap:24px;margin-top:20px}.board{position:relative;background:#091018;border:1px solid #2c434b;border-radius:10px;overflow:hidden}canvas{display:block;width:100%;aspect-ratio:2/3}.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button{padding:8px 12px;color:#edf6f3;background:#223740;border:1px solid #416069;border-radius:7px;cursor:pointer;font:inherit}button:hover{background:#304f59}.yellow{border-color:#eac370}.teal{border-color:#4fc0b3}.pink{border-color:#d378a3}.purple{border-color:#789fef}.warning{padding:10px;border-left:3px solid #d8ad62;background:#302c20;white-space:pre-wrap}pre{font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap;background:#111f28;border:1px solid #273d49;border-radius:8px;padding:14px}a{color:#8fd1db}small{color:#a9bcc6}.badge{display:inline-block;padding:3px 8px;background:#253e43;border-radius:4px;font-size:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:0 14px}.layout>aside{order:0}.board{max-width:576px}}</style>
<main><span class="badge">独立 CPU 游戏规则候选 · 未部署</span><h1>局部落砂 · 错位槽端点占位</h1><p class="note">四种颜色、物理端点半径 .875、绘制内缩八边形 .87、盘宽 232。粒子在合法错位槽端点间跳移，没有插值；这不是连续圆碰撞物理。默认仅 256 粒，大场必须手动启动。</p>
<div class="layout"><section><div class="board"><canvas id="board" width="576" height="864"></canvas></div><p><small id="scene">新规则确定投料场景</small></p></section><aside>
<div class="bar"><button id="pause">暂停</button><button id="reset">重开小场 256</button></div>
<div class="bar"><button id="large4056">重开 4056 · 色批676</button><button id="large12000">重开 12000 · 色批676</button></div>
<div class="bar"><button id="c1" class="yellow">黄 +132</button><button id="c2" class="teal">青 +132</button><button id="c3" class="pink">粉 +132</button><button id="c4" class="purple">紫 +132</button></div>
<div class="bar"><button id="bottom">大删底</button><button id="clearConnected">消除跨左右墙同色</button></div>
<div class="bar"><button id="fixture">载入人工跨墙测试</button></div>
<div id="lag" class="warning">固定 120Hz。计算超载会保留积压，不丢弃 dt。</div><pre id="status"></pre><pre id="event">尚无手动操作。</pre>
<p class="note">大删底只移除底部 23 行、x=60…228 区域内真实存在的粒子。新增/删除计数与存活数一起显示；暂停保留既有积压，重开是唯一清空时间和场景的操作。</p>

</aside></div></main><script type="module" src="./demo.mjs"></script></html>

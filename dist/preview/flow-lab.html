<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GRAINFORM 0.4.0 · 颗粒与流动设计对照</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111718;color:#e5e9e0}*{box-sizing:border-box}body{margin:0;padding:16px}header,footer,details{max-width:1000px;margin:0 auto 14px}h1{font-size:20px;margin:0 0 8px}p{font-size:14px;line-height:1.5;margin:6px 0;color:#b3c0ba}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}button,select,a{font:14px system-ui;background:#25342d;color:#edf0e7;border:1px solid #607363;border-radius:4px;min-height:40px;padding:8px 10px;text-decoration:none}button{cursor:pointer}button[aria-pressed=true]{background:#eec468;color:#202a1b}button:focus-visible,select:focus-visible{outline:2px solid #58d4ca;outline-offset:3px}.comparison{display:flex;gap:20px;justify-content:center}.side{width:min(380px,calc((100dvh - 280px)*.66667));min-width:220px}.side h2{font-size:15px;font-weight:500;margin:0 0 8px}canvas{display:block;width:100%;aspect-ratio:2/3;background:#0c1113;border:1px solid #4c5c53}.stats,#time{font:12px/1.5 ui-monospace,monospace;white-space:pre-line;color:#c4d0c7}.stats{min-height:52px;margin:8px 0}details{margin-top:15px}summary{font-size:14px}pre{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}footer{font-size:13px;line-height:1.5;color:#a5b3aa}@media(max-width:650px){body{padding:10px}.comparison{gap:10px}.side{width:calc((100vw - 30px)/2);min-width:0}.side h2{font-size:13px}h1{font-size:18px}.controls{gap:5px}button,select{font-size:12px;padding:7px}p{font-size:13px}}
</style></head><body><header><h1>0.4.0 · 整粒材质与流动对照</h1><p>隔离设计原型。默认缓存 R3 对照使用完全相同的物理、种子、材质和输入，只比较画法；切换更早参考时，释放冲量按各版规则计算。物理网格均为288 × 432。</p><div class="controls"><button data-scene="pour" aria-pressed="true">连续注沙</button><button data-scene="slope" aria-pressed="false">顺坡流动</button><button data-scene="avalanche" aria-pressed="false">局部塌落</button><button data-scene="settle" aria-pressed="false">落地收稳</button><button data-scene="collapse" aria-pressed="false">消除塌落</button></div><div class="controls"><button id="replay">同步重播</button><button id="pause">暂停</button><button id="step">前进一步</button><select id="baseline" aria-label="左侧参考版本"><option value="0.4-r3" selected>左：缓存 R3</option><option value="0.3">左：0.3 已交付</option><option value="0.4-r1">左：0.4 首轮</option></select><select id="mode" aria-label="对照方式"><option value="combined">综合对照</option><option value="material">只看材质：共用右侧状态</option><option value="motion">只看运动：共用旧版画法</option></select><label><input type="checkbox" id="contrast"> 高辨识</label><a href="game.html">原型试玩</a></div><p id="description"></p><div id="time"></div></header><main class="comparison"><section class="side"><h2 id="beforeTitle">缓存 R3 · 材质参考</h2><canvas id="before" aria-label="所选参考版本实时对照"></canvas><div id="beforeStats" class="stats"></div></section><section class="side"><h2 id="afterTitle">0.4.0 · 设计原型</h2><canvas id="after" aria-label="0.4.0实时对照"></canvas><div id="afterStats" class="stats"></div></section></main><details><summary>对照条件、守恒与成本</summary><pre id="labDiagnostics"></pre></details><footer>这里是实时计算的合成夹具，不是完整游戏实玩或真实物理认证。本轮显示保留整粒材料色差，并仅在真实自由边界内部做局部覆盖，不模糊整图、不补物理空隙；稳定沙堆应停止运动。双侧同时计算的耗时不能当作普通游戏帧率。</footer><script type="module" src="flow-lab.js"></script></body></html>
